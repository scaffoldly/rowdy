name: CI/CD (@scaffoldly/rowdy-vfs)

on:
  push:
    branches:
      - vfs
      - vfs-*
  pull_request:
    branches:
      - vfs
  workflow_dispatch: {}

permissions: write-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # Built once: each architecture's shim, then the package around both. Every test and the release use
  # these artifacts as they are; nothing downstream compiles or bundles again.
  compile:
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    name: Compile shim (${{ matrix.arch }})

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compile shim
        run: sh native/build.sh ${{ matrix.arch }}

      - name: Upload shim
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vfspreload-linux-${{ matrix.arch }}
          path: lib/linux-${{ matrix.arch }}/vfspreload.so
          if-no-files-found: error

  package:
    runs-on: ubuntu-latest
    needs: [compile]
    name: Build package

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: 'yarn'

      - name: Download shims
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vfspreload-linux-*
          path: lib
          merge-multiple: false

      - name: Build package
        run: |
          for arch in x64 arm64; do
            mkdir -p lib/linux-$arch
            mv lib/vfspreload-linux-$arch/vfspreload.so lib/linux-$arch/vfspreload.so
            rmdir lib/vfspreload-linux-$arch
          done
          yarn --frozen-lockfile && yarn build

      # DEVNOTE: npm v12 runs no install scripts and resolves no git or URL dependencies unless the
      # installer allows them, so a published package must need neither.
      - name: Check package installs without scripts
        run: |
          node <<'EOF_NODE'
          const { execSync } = require('child_process');
          const pkg = require('./package.json');
          const problems = [];
          for (const script of ['preinstall', 'install', 'postinstall']) {
            if (pkg.scripts?.[script]) problems.push(`scripts.${script}: ${pkg.scripts[script]}`);
          }
          const remote = /^(git[+:]|https?:|file:|link:|github:|gitlab:|bitbucket:|gist:)|^[^@\s:]+\/[^\s]+$/;
          for (const field of ['dependencies', 'optionalDependencies', 'peerDependencies']) {
            for (const [name, spec] of Object.entries(pkg[field] || {})) {
              if (remote.test(spec)) problems.push(`${field}.${name}: ${spec}`);
            }
          }
          const [{ files }] = JSON.parse(execSync('npm pack --dry-run --json --ignore-scripts', { encoding: 'utf8' }));
          for (const { path } of files) {
            if (path === 'binding.gyp' || path.endsWith('/binding.gyp')) problems.push(`${path}: an implicit node-gyp build`);
          }
          if (problems.length) {
            problems.forEach((p) => console.log(`::error title=Install-time::${p}`));
            process.exit(1);
          }
          console.log(`${pkg.name}: no install scripts, git or URL dependencies, or binding.gyp`);
          EOF_NODE

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: |
            dist
            lib
          if-no-files-found: error

  lint:
    runs-on: ubuntu-latest
    name: Lint

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: 'yarn'

      - name: Lint
        run: yarn && yarn lint

  # Every test, one matrix so they run and show as one group, each on the package artifact (no entry
  # compiles or bundles), and every one must pass for the release. An entry names its suite; `node` marks the ones that need node and the
  # package's dependencies, `package` the ones that need dist/ and the shims.
  #   unit         jest (yarn test) on each supported node
  #   cmocka       the shim's headers under cmocka, ASan + UBSan, built from source in Debian 12
  #   gate         the symbol gate (native/symbols.sh) rejects builds that break ADR 0003's rules
  #   bats         the shim under busybox/coreutils, node and C callers, on alpine and debian
  #   distroless   the shim in the distroless node image, as its nonroot user
  #   legacy       the shim in a process on glibc below 2.34
  #   sqlite       SQLite's own mptest and speedtest1 through the shim
  #   nodefs       node's own fs/promises tests (tests/native/nodefs) with testcontainers, at the
  #                runner's own architecture: on a docker volume (the gate), and through the shim on
  #                an S3-backed /vfs (reported only; skipped without AWS credentials)
  #   conformance  Step 4 of ADR 0002: the kernel's own 9P client mounts the server (needs the 9p modules)
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: unit, name: 'unit (node 22.x)', node: 22.x, package: true, runner: ubuntu-latest }
          - { suite: unit, name: 'unit (node 24.x)', node: 24.x, package: true, runner: ubuntu-latest }
          - { suite: cmocka, name: 'cmocka (x64)', arch: x64, runner: ubuntu-24.04 }
          - { suite: cmocka, name: 'cmocka (arm64)', arch: arm64, runner: ubuntu-24.04-arm }
          - { suite: gate, name: 'symbol gate (x64)', arch: x64, runner: ubuntu-24.04 }
          - { suite: gate, name: 'symbol gate (arm64)', arch: arm64, runner: ubuntu-24.04-arm }
          - { suite: bats, name: 'bats (alpine, x64)', flavour: alpine, arch: x64, node: 22.x, package: true, runner: ubuntu-24.04 }
          - { suite: bats, name: 'bats (alpine, arm64)', flavour: alpine, arch: arm64, node: 22.x, package: true, runner: ubuntu-24.04-arm }
          - { suite: bats, name: 'bats (debian, x64)', flavour: debian, arch: x64, node: 22.x, package: true, runner: ubuntu-24.04 }
          - { suite: bats, name: 'bats (debian, arm64)', flavour: debian, arch: arm64, node: 22.x, package: true, runner: ubuntu-24.04-arm }
          - { suite: distroless, name: 'distroless (x64)', arch: x64, node: 22.x, package: true, runner: ubuntu-24.04 }
          - { suite: distroless, name: 'distroless (arm64)', arch: arm64, node: 22.x, package: true, runner: ubuntu-24.04-arm }
          - { suite: legacy, name: 'glibc below 2.34 (x64)', arch: x64, package: true, runner: ubuntu-24.04 }
          - { suite: legacy, name: 'glibc below 2.34 (arm64)', arch: arm64, package: true, runner: ubuntu-24.04-arm }
          - { suite: sqlite, name: 'SQLite mptest (x64)', sqlite: mptest, arch: x64, node: 22.x, package: true, runner: ubuntu-24.04 }
          - { suite: sqlite, name: 'SQLite mptest (arm64)', sqlite: mptest, arch: arm64, node: 22.x, package: true, runner: ubuntu-24.04-arm }
          - { suite: sqlite, name: 'SQLite speedtest1 (x64)', sqlite: speedtest1, arch: x64, node: 22.x, package: true, runner: ubuntu-24.04 }
          - { suite: sqlite, name: 'SQLite speedtest1 (arm64)', sqlite: speedtest1, arch: arm64, node: 22.x, package: true, runner: ubuntu-24.04-arm }
          - { suite: nodefs, name: 'node fs (alpine, x64)', flavour: alpine, arch: x64, node: 22.x, package: true, runner: ubuntu-24.04 }
          - { suite: nodefs, name: 'node fs (alpine, arm64)', flavour: alpine, arch: arm64, node: 22.x, package: true, runner: ubuntu-24.04-arm }
          - { suite: nodefs, name: 'node fs (debian, x64)', flavour: debian, arch: x64, node: 22.x, package: true, runner: ubuntu-24.04 }
          - { suite: nodefs, name: 'node fs (debian, arm64)', flavour: debian, arch: arm64, node: 22.x, package: true, runner: ubuntu-24.04-arm }
          - { suite: conformance, name: 'Kernel v9fs conformance', node: 22.x, package: true, runner: ubuntu-latest }
    runs-on: ${{ matrix.runner }}
    needs: [package]
    name: ${{ matrix.name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js ${{ matrix.node }}
        if: ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'yarn'

      - name: Download package
        if: ${{ matrix.package }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      - name: Install dependencies
        if: ${{ matrix.node }}
        run: yarn --frozen-lockfile

      # A fork's pull request gets no OIDC token, so the bucket half runs only for this repository.
      - name: Configure AWS Credentials
        id: aws
        if: ${{ (matrix.suite == 'sqlite' || matrix.suite == 'nodefs' || matrix.suite == 'distroless') && vars.S3_BUCKET_CI != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Unit tests
        if: ${{ matrix.suite == 'unit' }}
        run: yarn test

      - name: Unit tests (cmocka, ASan + UBSan)
        if: ${{ matrix.suite == 'cmocka' }}
        run: sh tests/native/unit.sh ${{ matrix.arch }}

      - name: Gate rejects bad builds
        if: ${{ matrix.suite == 'gate' }}
        run: sh tests/native/negative.sh ${{ matrix.arch }}

      - name: Test shim (${{ matrix.flavour }})
        if: ${{ matrix.suite == 'bats' }}
        run: sh tests/native/test.sh ${{ matrix.arch }} ${{ matrix.flavour }}

      - name: Test shim (distroless node, nonroot)
        if: ${{ matrix.suite == 'distroless' }}
        run: sh tests/native/distroless.sh ${{ matrix.arch }}
        env:
          S3_BUCKET: ${{ steps.aws.outcome == 'success' && vars.S3_BUCKET_CI || '' }}
          S3_PREFIX: ${{ github.repository }}/${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.arch }}

      - name: Test shim (glibc below 2.34)
        if: ${{ matrix.suite == 'legacy' }}
        run: sh tests/native/legacy.sh ${{ matrix.arch }}

      - name: SQLite ${{ matrix.sqlite }}
        if: ${{ matrix.suite == 'sqlite' }}
        run: sh tests/native/sqlite.sh ${{ matrix.arch }} ${{ matrix.sqlite }}
        env:
          S3_BUCKET: ${{ steps.aws.outcome == 'success' && vars.S3_BUCKET_CI || '' }}
          S3_PREFIX: ${{ github.repository }}/${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.arch }}-${{ matrix.sqlite }}

      - name: node fs/promises tests
        if: ${{ matrix.suite == 'nodefs' }}
        run: yarn test:nodefs
        env:
          NODEFS_FLAVOUR: ${{ matrix.flavour }}
          NODEFS_S3_BUCKET: ${{ steps.aws.outcome == 'success' && vars.S3_BUCKET_CI || '' }}

      # The S3 store's supervisor log: every adapter event and S3 round trip, one JSON line each.
      - name: Upload node fs S3 logs
        if: ${{ always() && matrix.suite == 'nodefs' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nodefs-logs-${{ matrix.flavour }}-${{ matrix.arch }}
          path: .nodefs-logs
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Mount with v9fs and exercise it
        if: ${{ matrix.suite == 'conformance' }}
        run: sh tests/native/conformance.sh

  build-publish:
    runs-on: ubuntu-latest
    needs: [lint, test]
    name: Build and Publish to NPM
    if: |
      success() &&
      github.ref == 'refs/heads/vfs' &&
      github.event_name != 'pull_request' &&
      !contains(github.event.head_commit.message, '[skip-prerelease]')

    permissions:
      contents: write
      id-token: write

    # DEVNOTE: setup-node's registry-url writes an .npmrc that references ${NODE_AUTH_TOKEN}, and
    # yarn fails on an unset reference. The stage step sets the real token.
    env:
      NODE_AUTH_TOKEN: unused

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: 'yarn'
          registry-url: 'https://registry.npmjs.org'

      # The package every test ran on, as it is: no rebuild between testing and release.
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      - name: Generate pre-release version
        id: version
        run: |
          CURRENT_NAME=$(node -p "require('./package.json').name")
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          SHORT_SHA=${GITHUB_SHA:0:7}
          PRERELEASE_VERSION="${CURRENT_VERSION}-beta.${TIMESTAMP}.${SHORT_SHA}"
          echo "name=${CURRENT_NAME}" >> $GITHUB_OUTPUT
          echo "version=${PRERELEASE_VERSION}" >> $GITHUB_OUTPUT
          echo "current=${CURRENT_VERSION}" >> $GITHUB_OUTPUT

      - name: Update package.json version
        run: |
          yarn version --new-version ${{ steps.version.outputs.version }} --no-git-tag-version

      # DEVNOTE: rowdy consumes this package by commit, not through the registry: the registry
      # review of a release that carries an ELF takes an hour and a maintainer's 2FA, and rowdy is
      # the only consumer that needs the build the moment it exists. Every build lands as an asset
      # of one rolling pre-release, named by commit, so rowdy's package.json can pin
      #   https://github.com/scaffoldly/rowdy/releases/download/vfs-builds/rowdy-vfs-<sha>.tgz
      # The registry still gets the staged, attested release below for everyone else.
      - name: Publish build to the vfs-builds release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET="rowdy-vfs-${GITHUB_SHA:0:7}.tgz"
          mv "$(npm pack --silent)" "$ASSET"
          gh release view vfs-builds >/dev/null 2>&1 || gh release create vfs-builds \
            --prerelease --target "$GITHUB_SHA" --title "rowdy-vfs builds" \
            --notes "Builds of @scaffoldly/rowdy-vfs from the vfs branch, one asset per commit, for rowdy to pin by SHA. The npm registry carries the reviewed, attested releases."
          gh release upload vfs-builds "$ASSET" --clobber
          echo "asset=$ASSET" >> $GITHUB_OUTPUT
        id: asset

      # DEVNOTE: The OIDC token isn't an npm token. The registry exchanges it for a short-lived
      # publish token scoped to this package, the same exchange `npm publish` does internally.
      # Trusted publishing is configured on npmjs.com for this repository and vfs.yml.
      - name: Get npm token
        id: identity
        uses: cnuss/actions-identity@v1
        with:
          id-token-audience: npm:registry.npmjs.org
          exchange-url: https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@scaffoldly%2frowdy-vfs

      # DEVNOTE: This package declares dual-use content (contentPolicy + DISCLOSURE: it ships an
      # LD_PRELOAD libc interposer), so npm only lets CI *stage* a version; a maintainer promotes
      # it with 2FA via `npm stage approve <stage-id>` or on npmjs.com. npm, not yarn v1, because
      # `npm stage` needs npm >= 11.15 and --provenance attaches a sigstore/SLSA attestation
      # binding the tarball (shims included) to this workflow run.
      - name: Stage pre-release on NPM
        run: |
          npm install -g npm@12.2.0
          npm stage publish --tag beta --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ steps.identity.outputs.exchange-token }}

      - name: Create pre-release summary
        run: |
          echo "## 📦 Pre-release Staged" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** ${{ steps.version.outputs.name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** beta" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${GITHUB_SHA:0:7}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Approve (dual-use package: a maintainer promotes it with 2FA)" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "npm stage list ${{ steps.version.outputs.name }}" >> $GITHUB_STEP_SUMMARY
          echo "npm stage approve <stage-id>" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Then install with:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "npm install ${{ steps.version.outputs.name }}@${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** Add \`[skip-prerelease]\` to commit message to skip staging." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 For rowdy (no review wait)" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo "\"@scaffoldly/rowdy-vfs\": \"https://github.com/scaffoldly/rowdy/releases/download/vfs-builds/${{ steps.asset.outputs.asset }}\"" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
