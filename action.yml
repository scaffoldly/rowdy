name: Rowdy Deploy Action
description: Deploy a Docker Image with Rowdy
author: Scaffoldly <github.com/scaffoldly>
branding:
  icon: upload-cloud
  color: gray-dark
inputs:
  name:
    description: "The name of the application. (Default: the execution role's id)"
    required: false
    default: ""
  cloud:
    description: "The cloud provider to deploy to (aws, gcp, azure, or digitalocean)"
    required: true
  compute:
    description: "The compute type to deploy to (lambda, ecs, app-engine, azure-functions, or app-platform)"
    required: true
  image:
    description: "The Docker image to deploy (e.g. ghcr.io/owner/repo@sha256:...). Ignored when dockerfile is set."
    required: false
    default: ""
  dockerfile:
    description: "Path to a Dockerfile to build and push to ghcr.io/<owner>/<repo>:rowdy, then deploy as :rowdy@<digest> (pinned to the build, with a stable alias and Function URL). The build context is the Dockerfile's directory."
    required: false
    default: ""
  command:
    description: "Override the ENTRYPOINT/CMD in the Docker image. (Default: ENTRYPOINT+CMD defined in the image"
    required: false
    default: ""
  memory:
    description: "Amount of memory to allocate to the deployed container in megabytes. (Default: 256 on lambda, 512 on microvm, which takes 512, 1024, 2048, 4096 or 8192)"
    required: false
    default: ""
  cri:
    description: "Enable the Container Runtime Interface (CRI)"
    required: false
    default: "false"
  routes:
    description: "Path to, or inline YAML/JSON of, a Routes manifest."
    required: false
    default: ""
  secrets:
    description: "Environment variables: NAME=value lines and JSON objects such as the output of toJSON(secrets), in any mix."
    required: false
    default: ""
  volumes:
    description: "Volumes to mount, one per line: <scheme>://<locator>:<mountpoint>[:<flags>]. Added to any in routes."
    required: false
    default: ""
  layers-from:
    description: "Images whose one layer is added to the deployed image, one per line (public; FROM scratch, one COPY, as rowdy's is)."
    required: false
    default: ""
outputs:
  url:
    description: The URL of the deployed application.
    value: ${{ steps.deploy.outputs.url }}
  image:
    description: The image reference that was deployed.
    value: ${{ steps.deploy.outputs.image }}
  bucket:
    description: The bucket rowdy manages for s3:///<prefix> volumes, when the deployment has one.
    value: ${{ steps.deploy.outputs.bucket }}
  digest:
    description: The digest of the image built from dockerfile.
    value: ${{ steps.build.outputs.digest || steps.build-again.outputs.digest }}
  arn:
    description: The prebuilt microVM image's ARN, when one was built.
    value: ${{ steps.deploy.outputs.arn }}
  status:
    description: Whether a prebuilt microVM image was built or reused.
    value: ${{ steps.deploy.outputs.status }}
runs:
  using: "composite"
  steps:
    - name: Inspect workspace
      id: workspace
      shell: bash
      run: |
        if [ -z "$(ls -A "$GITHUB_WORKSPACE")" ]; then
          echo "empty=true" >> "$GITHUB_OUTPUT"
        fi

    # Only into an empty workspace: a caller's own checkout, wherever it put it, is left alone.
    - name: Checkout
      if: ${{ steps.workspace.outputs.empty == 'true' }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Resolve image
      id: image
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        DOCKERFILE: ${{ inputs.dockerfile }}
        REPOSITORY: ${{ github.repository }}
        OWNER: ${{ github.repository_owner }}
        NAME: ${{ inputs.name }}
      run: |
        # ROWDY_BUILD comes from the calling step's env, as rowdy's other settings do. A prebuild is built for the
        # runner's own platform, and the function is x86_64.
        BUILD="${ROWDY_BUILD:-false}"
        PLATFORM=linux/amd64
        if [ "$BUILD" = "true" ] && [ "$RUNNER_ARCH" = "ARM64" ]; then PLATFORM=linux/arm64; fi
        {
          echo "build=$BUILD"
          echo "platform=$PLATFORM"
          echo "cache=$([ "$BUILD" = "true" ] && echo "prebuild-$NAME-${PLATFORM#*/}" || echo rowdy)"
        } >> "$GITHUB_OUTPUT"
        if [ -z "$DOCKERFILE" ]; then
          if [ -z "$IMAGE" ]; then
            echo "::error title=Rowdy::Set either image or dockerfile."
            exit 1
          fi
          echo "ref=$IMAGE" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ -n "$IMAGE" ]; then
          echo "::warning title=Rowdy::image is ignored when dockerfile is set."
        fi
        if [ ! -f "$DOCKERFILE" ]; then
          echo "::error title=Rowdy::dockerfile '$DOCKERFILE' not found in the checkout."
          exit 1
        fi
        # ghcr.io rejects uppercase, and github.repository keeps the owner's case.
        if [ "$BUILD" = "true" ]; then
          echo "name=ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/prebuild/$NAME" >> "$GITHUB_OUTPUT"
        else
          echo "name=ghcr.io/$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
        fi
        echo "context=$(dirname "$DOCKERFILE")" >> "$GITHUB_OUTPUT"

    - name: Set up QEMU
      if: ${{ inputs.dockerfile != '' && runner.arch != 'X64' && steps.image.outputs.build != 'true' }}
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

    - name: Set up Docker Buildx
      if: ${{ inputs.dockerfile != '' }}
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Log in to GitHub Container Registry
      if: ${{ inputs.dockerfile != '' }}
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Build and push image
      id: build
      if: ${{ inputs.dockerfile != '' }}
      # ghcr.io refuses a push now and then, with a 403 or a permission_denied the same token doesn't get a minute later.
      continue-on-error: true
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ steps.image.outputs.context }}
        file: ${{ inputs.dockerfile }}
        platforms: ${{ steps.image.outputs.platform }}
        pull: true
        cache-from: type=gha,scope=${{ steps.image.outputs.cache }}
        cache-to: type=gha,scope=${{ steps.image.outputs.cache }},mode=max
        # A prebuild is pushed by its digest alone, which is the same for the same image: timestamps are pinned and
        # there's no provenance, whose build times would change it. A later job combines the platforms into a tag.
        push: ${{ steps.image.outputs.build != 'true' }}
        tags: ${{ steps.image.outputs.build != 'true' && format('{0}:rowdy', steps.image.outputs.name) || '' }}
        outputs: ${{ steps.image.outputs.build == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true,rewrite-timestamp=true', steps.image.outputs.name) || '' }}
        provenance: ${{ steps.image.outputs.build == 'true' && 'false' || '' }}
        build-args: ${{ steps.image.outputs.build == 'true' && 'SOURCE_DATE_EPOCH=0' || '' }}

    - name: Wait to push again
      if: ${{ steps.build.outcome == 'failure' }}
      shell: bash
      run: sleep 30

    # The build is cached by now, so this only pushes.
    - name: Build and push image, again
      id: build-again
      if: ${{ steps.build.outcome == 'failure' }}
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ steps.image.outputs.context }}
        file: ${{ inputs.dockerfile }}
        platforms: ${{ steps.image.outputs.platform }}
        pull: true
        cache-from: type=gha,scope=${{ steps.image.outputs.cache }}
        cache-to: type=gha,scope=${{ steps.image.outputs.cache }},mode=max
        # A prebuild is pushed by its digest alone, which is the same for the same image: timestamps are pinned and
        # there's no provenance, whose build times would change it. A later job combines the platforms into a tag.
        push: ${{ steps.image.outputs.build != 'true' }}
        tags: ${{ steps.image.outputs.build != 'true' && format('{0}:rowdy', steps.image.outputs.name) || '' }}
        outputs: ${{ steps.image.outputs.build == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true,rewrite-timestamp=true', steps.image.outputs.name) || '' }}
        provenance: ${{ steps.image.outputs.build == 'true' && 'false' || '' }}
        build-args: ${{ steps.image.outputs.build == 'true' && 'SOURCE_DATE_EPOCH=0' || '' }}

    - name: Configure AWS Credentials
      if: ${{ inputs.cloud == 'aws' }}
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        aws-region: ${{ env.AWS_REGION || 'us-east-1' }}
        role-to-assume: ${{ env.AWS_ROLE_ARN }}

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0

    - name: Deploy with Rowdy
      id: deploy
      shell: bash
      run: |
        echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
        if [ "$BUILD" = "true" ]; then
          # ROWDY_BUILD in the env is rowdy's --build, and the Dockerfile gives the build its FROM.
          export ROWDY_PLATFORM="$PLATFORM"
          if [ -n "$DOCKERFILE" ]; then export ROWDY_DOCKERFILE="$DOCKERFILE"; fi
          npx @scaffoldly/rowdy@beta create ${{ inputs.cloud }} ${{ inputs.compute }} "$IMAGE"
          exit 0
        fi
        npx @scaffoldly/rowdy@beta create ${{ inputs.cloud }} ${{ inputs.compute }} "$IMAGE" ${{ inputs.command }}
      env:
        BUILD: ${{ steps.image.outputs.build }}
        PLATFORM: ${{ steps.image.outputs.platform }}
        DOCKERFILE: ${{ inputs.dockerfile }}
        IMAGE: ${{ inputs.dockerfile != '' && format(steps.image.outputs.build == 'true' && '{0}@{1}' || '{0}:rowdy@{1}', steps.image.outputs.name, steps.build.outputs.digest || steps.build-again.outputs.digest) || steps.image.outputs.ref }}
        ROWDY_NAME: "${{ inputs.name }}"
        # A microVM's memory is one of AWS's sizes, the smallest 512.
        ROWDY_MEMORY: "${{ inputs.memory || (inputs.compute == 'microvm' && '512' || '256') }}"
        ROWDY_CRI: "${{ inputs.cri }}"
        ROWDY_ROUTES: "${{ inputs.routes }}"
        ROWDY_SECRETS: "${{ inputs.secrets }}"
        ROWDY_VOLUMES: "${{ inputs.volumes }}"
        ROWDY_LAYERS_FROM: "${{ inputs.layers-from }}"
