name: Rowdy Deploy Action
description: Deploy a Docker Image with Rowdy
author: Scaffoldly <github.com/scaffoldly>
branding:
  icon: upload-cloud
  color: gray-dark
inputs:
  name:
    description: "The name of the application. (Default: the execution role's id)"
    required: false
    default: ""
  cloud:
    description: "The cloud provider to deploy to (aws, gcp, azure, or digitalocean)"
    required: true
  compute:
    description: "The compute type to deploy to (lambda, ecs, app-engine, azure-functions, or app-platform)"
    required: true
  image:
    description: "The Docker image to deploy (e.g. ghcr.io/owner/repo@sha256:...). Ignored when dockerfile is set."
    required: false
    default: ""
  dockerfile:
    description: "Path to a Dockerfile to build and push to ghcr.io/<owner>/<repo>:rowdy, then deploy as :rowdy@<digest> (pinned to the build, with a stable alias and Function URL). The build context is the Dockerfile's directory."
    required: false
    default: ""
  command:
    description: "Override the ENTRYPOINT/CMD in the Docker image. (Default: ENTRYPOINT+CMD defined in the image"
    required: false
    default: ""
  memory:
    description: "Amount of memory to allocate to the deployed container in megbytes. (Default: 256)"
    required: false
    default: "256"
  cri:
    description: "Enable the Container Runtime Interface (CRI)"
    required: false
    default: "false"
  routes:
    description: "Path to, or inline YAML/JSON of, a Routes manifest."
    required: false
    default: ""
  secrets:
    description: "Environment variables: NAME=value lines and JSON objects such as the output of toJSON(secrets), in any mix."
    required: false
    default: ""
  volumes:
    description: "Volumes to mount, one per line: <scheme>://<locator>:<mountpoint>[:<flags>]. Added to any in routes."
    required: false
    default: ""
outputs:
  url:
    description: The URL of the deployed application.
    value: ${{ steps.deploy.outputs.url }}
  image:
    description: The image reference that was deployed.
    value: ${{ steps.deploy.outputs.image }}
runs:
  using: "composite"
  steps:
    - name: Inspect workspace
      id: workspace
      shell: bash
      run: |
        if [ -z "$(ls -A "$GITHUB_WORKSPACE")" ]; then
          echo "empty=true" >> "$GITHUB_OUTPUT"
        fi

    # Only into an empty workspace: a caller's own checkout, wherever it put it, is left alone.
    - name: Checkout
      if: ${{ steps.workspace.outputs.empty == 'true' }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Resolve image
      id: image
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        DOCKERFILE: ${{ inputs.dockerfile }}
        REPOSITORY: ${{ github.repository }}
      run: |
        if [ -z "$DOCKERFILE" ]; then
          if [ -z "$IMAGE" ]; then
            echo "::error title=Rowdy::Set either image or dockerfile."
            exit 1
          fi
          echo "ref=$IMAGE" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ -n "$IMAGE" ]; then
          echo "::warning title=Rowdy::image is ignored when dockerfile is set."
        fi
        if [ ! -f "$DOCKERFILE" ]; then
          echo "::error title=Rowdy::dockerfile '$DOCKERFILE' not found in the checkout."
          exit 1
        fi
        # ghcr.io rejects uppercase, and github.repository keeps the owner's case.
        echo "name=ghcr.io/$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
        echo "context=$(dirname "$DOCKERFILE")" >> "$GITHUB_OUTPUT"

    - name: Set up QEMU
      if: ${{ inputs.dockerfile != '' && runner.arch != 'X64' }}
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

    - name: Set up Docker Buildx
      if: ${{ inputs.dockerfile != '' }}
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Log in to GitHub Container Registry
      if: ${{ inputs.dockerfile != '' }}
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Build and push image
      id: build
      if: ${{ inputs.dockerfile != '' }}
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ steps.image.outputs.context }}
        file: ${{ inputs.dockerfile }}
        # The function is x86_64.
        platforms: linux/amd64
        pull: true
        push: true
        tags: ${{ steps.image.outputs.name }}:rowdy
        cache-from: type=gha,scope=rowdy
        cache-to: type=gha,scope=rowdy,mode=max

    - name: Configure AWS Credentials
      if: ${{ inputs.cloud == 'aws' }}
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        aws-region: ${{ env.AWS_REGION || 'us-east-1' }}
        role-to-assume: ${{ env.AWS_ROLE_ARN }}

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0

    - name: Deploy with Rowdy
      id: deploy
      shell: bash
      run: |
        echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
        npx @scaffoldly/rowdy@beta create ${{ inputs.cloud }} ${{ inputs.compute }} "$IMAGE" ${{ inputs.command }}
      env:
        IMAGE: ${{ inputs.dockerfile != '' && format('{0}:rowdy@{1}', steps.image.outputs.name, steps.build.outputs.digest) || steps.image.outputs.ref }}
        ROWDY_NAME: "${{ inputs.name }}"
        ROWDY_MEMORY: "${{ inputs.memory }}"
        ROWDY_CRI: "${{ inputs.cri }}"
        ROWDY_ROUTES: "${{ inputs.routes }}"
        ROWDY_SECRETS: "${{ inputs.secrets }}"
        ROWDY_VOLUMES: "${{ inputs.volumes }}"
